appId: app.bendo.desktop
productName: Bendo
copyright: Copyright © Bendo

# Shell + embedded Bendo (Next standalone) + slim harness (Doro / dsh web).
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - static/**/*
  - package.json

extraResources:
  # Standalone Next needs its node_modules; electron-builder's default FileSet
  # ignore drops **/node_modules/** when nested under `from`, so copy deps separately.
  - from: resources/bendo-app
    to: bendo-app
    filter:
      - "**/*"
      - "!node_modules"
      - "!node_modules/**"
  - from: resources/bendo-app/node_modules
    to: bendo-app/node_modules
    filter:
      - "**/*"
  # Slim harness (build:harness). Same node_modules split as bendo-app.
  - from: resources/harness
    to: harness
    filter:
      - "**/*"
      - "!node_modules"
      - "!node_modules/**"
  - from: resources/harness/node_modules
    to: harness/node_modules
    filter:
      - "**/*"

asar: true

# OS opens Electron for OAuth handoff (bendo://auth/callback?target=…).
protocols:
  - name: Bendo
    schemes:
      - bendo

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - dir
  # Local MVP: unsigned. Distribution signing / notarize comes later.
  identity: null
  hardenedRuntime: false
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: app.bendo.desktop
        CFBundleURLSchemes:
          - bendo

dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Windows — unsigned beta OK (SmartScreen warning). Prepare is Node copy (win-safe).
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Bendo

